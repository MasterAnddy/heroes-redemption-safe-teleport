name: Publish English release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-english-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify release archives
        shell: bash
        run: sha256sum --check SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: echo '' | base64 --decode > "$RUNNER_TEMP/release-notes.md"

      - name: Update repository description
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}"
          -f "description=Offline single-player recovery tool for Heroes & Redemption. Press F6 to return to a reliable checkpoint. Includes a persistent BepInEx plugin and a Windows live recovery tool."

      - name: Replace v1.0.0 release notes and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit v1.0.0 --repo "$GITHUB_REPOSITORY" --title "v1.0.0 - Safe Teleport" --notes-file "$RUNNER_TEMP/release-notes.md" --latest
          gh release upload v1.0.0 --repo "$GITHUB_REPOSITORY" --clobber \
            dist/HeroesRedemption-SafeTeleport-BepInEx.zip \
            dist/HeroesRedemption-SafeTeleport-Live.zip \
            SHA256SUMS
